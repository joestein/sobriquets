name: CI

on:
  push:
    branches: [main, "on-loop/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio python-frontmatter fastapi httpx pydantic-settings anyio "langchain-core>=0.3.0" "pgvector>=0.3.0" "sqlalchemy[asyncio]>=2.0.0" asyncpg "langgraph>=0.2.0" "langchain-anthropic>=0.2.0"

      - name: Run tests
        run: pytest tests/ -v

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck
